name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/ui
        run: npm ci

      - name: Build Angular app
        working-directory: frontend/ui
        env:
          API_URL: ${{ secrets.API_URL || 'https://your-backend-url.railway.app/api' }}
        run: |
          # Create environment file with API URL
          echo "export const environment = {
            production: true,
            apiUrl: '$API_URL'
          };" > src/environments/environment.prod.ts
          npm run build -- --configuration=production --base-href=/mini_sample_management_AI_agent/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/ui/dist/ui/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
